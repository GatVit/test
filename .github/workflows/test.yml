name: Test

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Git
        run: |
          git config --local user.name "GatVit"
          git config --local user.email "277098481+GatVit@users.noreply.github.com"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check activity and commit
        run: |
          python -c "
          import urllib.request, json, datetime, subprocess, os, time

          today = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d')
          
          target_commits = 1
          try:
              with open('datetest.json', 'r') as f:
                  config = json.load(f)
                  if today in config:
                      target_commits = 12
          except Exception:
              pass
              
          url = 'https://api.github.com/users/GatVit/events/public'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          current_commits = 0
          
          try:
              with urllib.request.urlopen(req) as response:
                  events = json.loads(response.read().decode())
                  for event in events:
                      if event.get('type') == 'PushEvent' and event.get('created_at', '').startswith(today):
                          current_commits += event.get('payload', {}).get('size', 0)
          except Exception as e:
              pass
              
          missing_commits = target_commits - current_commits
          
          if missing_commits <= 0:
              exit(0)
              
          for i in range(missing_commits):
              rand_str = os.urandom(4).hex()
              with open('file.txt', 'a') as f:
                  f.write(f'{rand_str}\n')
              
              subprocess.run(['git', 'add', 'file.txt'])
              subprocess.run(['git', 'commit', '-m', rand_str])
              time.sleep(1)
          
          subprocess.run(['git', 'push', 'https://x-access-token:' + os.environ['GITHUB_TOKEN'] + '@github.com/' + os.environ['GITHUB_REPOSITORY'] + '.git', 'HEAD:' + os.environ['GITHUB_REF_NAME']])
          "
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
